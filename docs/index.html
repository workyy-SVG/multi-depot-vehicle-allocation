<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>编程作业1 · 多仓库车辆分配</title>
<style>
:root{font-family:system-ui,sans-serif;color:#19283e;background:#f0f4f8;color-scheme:light}
*{box-sizing:border-box}body{margin:0}header{background:#142c48;color:#fff;padding:36px max(5vw,20px)}header p{color:#cbdced;margin:0}h1{font-size:clamp(24px,4vw,40px);margin:8px 0 12px}
main{width:min(1160px,92%);margin:24px auto 40px}.controls,.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;align-items:center}select{font:inherit;padding:9px;border:1px solid #9daec1;border-radius:7px;background:white;color:inherit}
.summary span{background:#e0ecf9;padding:8px 12px;border-radius:6px}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}section{background:white;padding:18px;border:1px solid #d6e0eb;border-radius:12px;min-width:0}h2{font-size:19px;margin:0 0 12px}canvas{display:block;width:100%;height:365px;background:#f8fafc;border-radius:8px}small,.note{color:#475a70}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e0e7ef;padding:9px 5px}td:last-child{overflow-wrap:anywhere}button{font:inherit;cursor:pointer;border:1px solid #b5c5d7;background:white;color:inherit;padding:5px 8px;border-radius:6px}button[aria-pressed=true]{background:#dcecfb;border-color:#386893}.cost{margin-top:16px}.row{display:grid;grid-template-columns:100px minmax(30px,1fr) 85px;align-items:center;gap:10px;margin:9px 0}.track{background:#edf2f8;border-radius:4px;overflow:hidden}.bar{height:13px;background:#738ba7}.selected{background:#007c72}.value{text-align:right;font-variant-numeric:tabular-nums}@media(max-width:740px){.grid{grid-template-columns:1fr}canvas{height:300px}}
</style>
<script defer src="data.js"></script><script defer src="app.js"></script>
</head>
<body>
<header><p>算法设计课程 · 编程作业1</p><h1>多周期需求下的多仓库车辆分配</h1><p>比较分车策略，查看仓库、客户和车辆的分配结果。</p></header>
<main>
<div class="controls"><label for="instance">测试实例</label><select id="instance"></select></div>
<div class="summary" id="summary" aria-live="polite"></div>
<div class="grid">
<section><h2>仓库与客户位置</h2><canvas id="map" role="img" aria-label="平面坐标图，方块表示仓库，圆点表示客户。"></canvas><p class="note">方块是仓库，圆点是客户。点击右侧仓库编号可突出显示其负责的客户。</p></section>
<section><h2>最终车辆分配</h2><table><thead><tr><th>仓库</th><th>车辆数</th><th>总载重</th><th>车辆编号（载重）</th></tr></thead><tbody id="fleet"></tbody></table><p class="note" id="data-note"></p></section>
</div>
<section class="cost"><h2>滚动验证成本</h2><label for="window">验证窗口</label> <select id="window"></select><p class="note" id="periods"></p><div id="costs" aria-live="polite"></div><p id="comparison"></p><small>成本为行驶距离与未服务罚分之和，越低越好。每个窗口使用该窗口之前的历史生成方案，图表展示本地验证估算。上方车辆表展示最终提交方案。</small></section>
</main>
</body></html>
