<body>
<p>正在打开车辆分配 AI 问答。</p>
<p><a id="continue" href="https://multi-depot-vehicle-allocation-q5pvak8radnex77ftefspu.streamlit.app/">打开 AI 问答</a></p>
<script>
const link = document.getElementById('continue');
const target = new URL(link.href);
const params = new URLSearchParams(window.location.search);
for (const key of ['instance', 'window']) {
  const value = params.get(key);

}
